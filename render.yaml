services:
  - type: web
    name: quotex-live-signal-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: QUOTEX_SSID
        sync: false
      - key: QUOTEX_DEMO
        value: "true"
