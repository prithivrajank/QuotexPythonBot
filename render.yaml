services:
  - type: web
    name: quotex-live-signal-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MARKET_DATA_PROVIDER
        value: "twelve_data"
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: QUANTEX_API_KEY
        sync: false
      - key: QUANTEX_BROKER
        value: "quotex"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: REFRESH_INTERVAL_SECONDS
        value: "300"
      - key: FOREX_SYMBOLS
        value: "EUR/USD,GBP/USD,USD/JPY,AUD/USD,USD/CAD,USD/CHF,NZD/USD,EUR/GBP,EUR/JPY,GBP/JPY"
      - key: FOREX_TIMEFRAME_SECONDS
        value: "60"
      - key: DATABASE_PATH
        value: "/tmp/forex_signal_history.db"
      - key: QUOTEX_DEMO
        value: "true"
